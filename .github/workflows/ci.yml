name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, unit, integration & e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcpreps
          POSTGRES_PASSWORD: mcpreps
          POSTGRES_DB: mcpreps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpreps"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Throwaway CI-only values (no real secrets).
      DATABASE_URL: postgresql://mcpreps:mcpreps@localhost:5432/mcpreps_ci?schema=public
      TEST_DATABASE_URL: postgresql://mcpreps:mcpreps@localhost:5432/mcpreps_test?schema=public
      E2E_DATABASE_URL: postgresql://mcpreps:mcpreps@localhost:5432/mcpreps_e2e?schema=public
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      NEXT_PUBLIC_SITE_URL: http://localhost:3200
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create E2E database
        run: PGPASSWORD=mcpreps psql -h localhost -U mcpreps -d mcpreps_test -c 'CREATE DATABASE mcpreps_e2e'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
